<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    
    <body  bgcolor=lightblue >
        
        <h2>Student Registration Form</h2>

        <form>
            <label>Student Name: </label>
            <input type="text" name="sname" required>
            <br><br>

            <label>Email:</label>
            <input type="text" name="email" required>
            <input type="text" placeholder="Enter Valid Email Address">
            <br><br>

            <label>Password:</label>
            <input type="password" name="password" maxlength="20" minlength="8">
            <br><br>

            <label>Phone Number:</label>
            <input type="number" name="phonenumber" required>
            <input type="text"pattern>
            <label>Age:</label>
            <input type="number" name="age">
            <br><br><br><br>

            <label>Gender:</label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="gender">Female
            <br><br>

            <label>Skills:</label>
            <input type="checkbox" name="skill">HTML
            <input type="checkbox" name="skill">CSS
            <input type="checkbox" name="skill">JAVASCRIPT
            <br><br>

            <label>Date Of Birth:</label>
            <input type="date" name="dob"><button>Register</button>
            <br><br>

            <label>Department:</label>
            <Select name="CSE">
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="CS&amp;IT ">CS&amp;IT</option>
            </Select>

            <br><hr><br>

            <label>Reset</label>
            <input type="reset" value="Reset">
            <input type="submit" value="submit">
            <br><br>

            <label>Address</label>
            <input type="address"

            <button>"submit">Submit</button>

        </form>

        <p style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;"> THE ABOVE FORM IS TO VERIFY THE STUDENT DETAILS </p>
    </body>
</html>
